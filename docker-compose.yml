# Local infrastructure for WorkFlowPro.
# Values come from .env (Docker Compose reads it automatically). Copy .env.example to .env first.
services:
  postgres:
    image: postgres:16-alpine
    container_name: workflowpro-postgres
    environment:
      # Admin (superuser) account - used only by the init script and for troubleshooting
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      # One database + one owner account per service (read by init/01-create-service-databases.sh)
      AUTH_DB_NAME: ${AUTH_DB_NAME:?}
      AUTH_DB_USER: ${AUTH_DB_USER:?}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      PROJECT_DB_NAME: ${PROJECT_DB_NAME:?}
      PROJECT_DB_USER: ${PROJECT_DB_USER:?}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?set PROJECT_DB_PASSWORD in .env}
      TASK_DB_NAME: ${TASK_DB_NAME:?}
      TASK_DB_USER: ${TASK_DB_USER:?}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?set TASK_DB_PASSWORD in .env}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME:?}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER:?}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "${DB_PORT:-5440}:5432"
    volumes:
      - workflowpro-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  workflowpro-pgdata:
