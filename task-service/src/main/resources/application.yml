spring:
  application:
    name: task-service

  # This service's own database. Password has NO default: it must come from the environment (.env).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${TASK_DB_NAME:task_db}
    username: ${TASK_DB_USER:task_user}
    password: ${TASK_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match the tables.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same secret and issuer as auth-service, used only to VERIFY tokens
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:workflowpro-auth}
  services:
    # Direct service-to-service URLs (not through the gateway)
    auth-url: ${AUTH_SERVICE_URL:http://localhost:9081}
    project-url: ${PROJECT_SERVICE_URL:http://localhost:9082}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

server:
  port: ${TASK_SERVICE_PORT:9083}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
