spring:
  application:
    name: project-service

  # This service's own database. Password has NO default: it must come from the environment (.env).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${PROJECT_DB_NAME:project_db}
    username: ${PROJECT_DB_USER:project_user}
    password: ${PROJECT_DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match the tables.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PROJECT_SERVICE_PORT:9082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
