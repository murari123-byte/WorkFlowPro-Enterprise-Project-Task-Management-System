spring:
  application:
    name: project-service

  # This service's own database. Password has NO default: it must come from the environment (.env).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${PROJECT_DB_NAME:project_db}
    username: ${PROJECT_DB_USER:project_user}
    password: ${PROJECT_DB_PASSWORD}

  jpa:
    open-in-view: false
    properties:
      # Load lazy collections (e.g. user roles, project members) for up to 50 rows in ONE query (avoids N+1)
      hibernate.default_batch_fetch_size: 50
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match the tables.
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # Same secret and issuer as auth-service, used only to VERIFY tokens
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:workflowpro-auth}
  services:
    # Direct service-to-service URLs (not through the gateway)
    auth-url: ${AUTH_SERVICE_URL:http://localhost:9081}
    task-url: ${TASK_SERVICE_URL:http://localhost:9083}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html

server:
  port: ${PROJECT_SERVICE_PORT:9082}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Only "UP"/"DOWN" is public. Component details (database, disk) are not shown to anonymous callers.
      show-details: when-authorized
