spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # The browser only ever talks to the gateway. Each route forwards a path prefix
          # to one service, unchanged (no prefix stripping). Service URLs come from env vars.
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:9081}
              predicates:
                - Path=/api/auth/**,/api/users/**
            - id: project-service
              uri: ${PROJECT_SERVICE_URL:http://localhost:9082}
              predicates:
                - Path=/api/projects/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:9083}
              predicates:
                - Path=/api/tasks/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:9084}
              predicates:
                - Path=/api/notifications/**

          # If a service ever adds its own CORS headers, keep only one copy
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_UNIQUE

          # CORS is handled ONLY here. Services never see browser preflight (OPTIONS) requests.
          globalcors:
            cors-configurations:
              '[/**]':
                # Comma-separated list, e.g. http://localhost:5173,https://app.example.com
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type
                max-age: 3600

server:
  port: ${GATEWAY_PORT:9080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
